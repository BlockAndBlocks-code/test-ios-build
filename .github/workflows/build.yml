name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iOS Device
        run: |
          xcodebuild \
            -project TestApp.xcodeproj \
            -scheme TestApp \
            -sdk iphoneos \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_COMPILATION_MODE=incremental \
            build

      - name: Package unsigned .ipa
        run: |
          mkdir -p Payload
          cp -r ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Debug-iphoneos/TestApp.app Payload/ 2>/dev/null || \
          find ~/Library/Developer/Xcode/DerivedData -name "TestApp.app" -path "*Debug-iphoneos*" -type d -exec cp -r {} Payload/ \;
          zip -r TestApp-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TestApp-ipa
          path: TestApp-unsigned.ipa